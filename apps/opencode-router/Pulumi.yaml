name: opencode-router
description: opencode-router deployment — per-user isolated OpenCode instances on homelab k8s
runtime:
  name: nodejs
  options:
    typescript: true
main: src/

config:
  # All values use the "code:" namespace prefix (matching the pulumi.Config("code") in src/index.ts)
  # Set with: pulumi config set code:<key> <value>

  # Stack reference to your homelab base stack (provides tunnelCname, cloudflareZoneId, domain).
  # Required — no default. Set with:
  #   pulumi config set code:homelabStack <your-pulumi-org>/homelab/dev
  # Image references — update when new images are built
  # pulumi config set code:routerImage ghcr.io/mrsimpson/opencode-router:<tag>
  # Optional pins for the images built here (default: the digest of `latest` at deploy time):
  # pulumi config set opencode-router:cfOperatorImage ghcr.io/digitaleraluhut/opencode-cloudflare-operator@sha256:<digest>
  # pulumi config set opencode-router:opencodeImage ghcr.io/digitaleraluhut/opencode@sha256:<digest>

  # Secrets (set with --secret flag):
  # pulumi config set cloudflare:apiToken <token> --secret
