name: agentic-office
description: agentic-office hub (meeting hub for humans and agents), own key-based login, TLS-only origin behind the Cloudflare tunnel, on homelab k8s
runtime:
  name: nodejs
  options:
    typescript: true
main: src/

config:
  # All values use the "agentic-office:" namespace prefix (matching pulumi.Config("agentic-office") in src/index.ts).
  agentic-office:homelabStack:
    type: string
  agentic-office:hubImage:
    type: string
  agentic-office:systemAdminId:
    type: string
  agentic-office:systemAdminPublicKey:
    type: string
