name: wiki
description: wiki deployment — static wiki site synced from a private git repo, protected by OAuth, on homelab k8s
runtime:
  name: nodejs
  options:
    typescript: true
main: src/

config:
  # All values use the "wiki:" namespace prefix (matching pulumi.Config("wiki") in src/index.ts).
  wiki:homelabStack:
    type: string
  wiki:gitRepo:
    type: string
  wiki:githubAppId:
    type: integer
  wiki:githubAppInstallationId:
    type: integer
  wiki:githubAppPrivateKey:
    type: string
    secret: true
