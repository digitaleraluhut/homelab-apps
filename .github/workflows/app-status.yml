name: App status

# An app is a directory apps/<name>/ with a Pulumi.yaml (no registry).
# - every Pulumi.yaml is named like its directory (one name per app: project, stack, namespace)
# - the README apps table matches the apps

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/*/Pulumi.yaml
      - .github/scripts/app_status.py
      - README.md

permissions:
  contents: read

jobs:
  check:
    name: App status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Naming rule and README apps table
        run: python3 .github/scripts/app_status.py check-readme
