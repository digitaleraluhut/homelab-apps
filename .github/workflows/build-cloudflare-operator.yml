name: Build opencode-cloudflare-operator image

# Images are built and pushed from main only: a push to any other branch
# would publish unreviewed code to GHCR (including :latest).
on:
  push:
    branches:
      - main
    paths:
      - apps/opencode-router/cloudflare-operator/**
      - .github/workflows/build-cloudflare-operator.yml
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to GHCR"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  pull-requests: write   # on main the image bump goes through a bot PR

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-operator-npm-${{ hashFiles('apps/opencode-router/cloudflare-operator/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-operator-npm-

      - name: Install dependencies
        run: |
          cd apps/opencode-router/cloudflare-operator
          npm install --ignore-scripts

      - name: Run tests
        run: |
          cd apps/opencode-router/cloudflare-operator
          npm test

      - name: Type check
        run: |
          cd apps/opencode-router/cloudflare-operator
          npm run typecheck

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/opencode-cloudflare-operator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./apps/opencode-router/cloudflare-operator/package.json').version")
          SHA_SHORT=${GITHUB_SHA::7}
          # Sanitize branch name for Docker tag (replace / with -)
          SAFE_REF_NAME=${GITHUB_REF_NAME//\//-}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}-${SAFE_REF_NAME}.${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/opencode-router/cloudflare-operator
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image tag
        run: echo "Built and pushed ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}"

      - name: Update Pulumi stack config with new image tag
        run: |
          .github/scripts/commit-via-pr.sh sync
          yq e '.config["code:cfOperatorImage"] = "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}"' \
            -i apps/opencode-router/Pulumi.dev.yaml
          .github/scripts/commit-via-pr.sh commit "chore(deploy): update cfOperatorImage to ${{ steps.version.outputs.tag }}" \
            apps/opencode-router/Pulumi.dev.yaml
        env:
          GH_TOKEN: ${{ github.token }}
