name: CI

# Same checks as the local scripts: types (all workspaces), tests (vitest and the Python
# tests of .github/scripts), renovate.json.
# No secrets, no Pulumi preview (needs credentials).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Types (all workspaces)
        run: npm run type-check

      - name: Tests (vitest, all tests)
        run: npm test

      - name: Tests (.github/scripts)
        run: python3 -m unittest discover -s .github/scripts

      - name: Validate renovate.json
        run: npm exec --yes --package=renovate@41 -- renovate-config-validator --strict renovate.json
