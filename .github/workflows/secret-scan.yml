name: Secret scan

# Scans every pushed/PR'd commit for secrets with gitleaks. Backstop for the
# local pre-commit hook, which can be skipped with --no-verify.
# Uses the gitleaks binary directly: gitleaks-action needs a paid license for orgs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks

      - name: Scan new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD"            # new branch: everything reachable from HEAD
          else
            RANGE="$BASE..$HEAD"
          fi
          gitleaks git --log-opts="$RANGE" --config .github/gitleaks.toml \
            --ignore-gitleaks-allow --redact --no-banner --verbose .
