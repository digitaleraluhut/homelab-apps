name: Deploy apps

# One generic deploy pipeline. Replaces the per-app deploy-<app>.yml.
# Deploys every app (apps/<name>/ with a Pulumi.yaml) changed on main, to stack
# mrsimpson/<name>/dev. Each app creates its own namespace. See .github/scripts/deploy_matrix.py.
# Secrets live in the "production" environment (main only), applied by the reusable workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy (directory name under apps/)
        type: string
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      any: ${{ steps.m.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: m
        env:
          APP: ${{ inputs.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$APP" ]; then
            python3 .github/scripts/deploy_matrix.py --app "$APP"
          else
            # new branch / forced push: before is all zeros -> fall back to the parent commit
            case "$BEFORE" in 0000000*|"") BEFORE="${GITHUB_SHA}~1" ;; esac
            python3 .github/scripts/deploy_matrix.py "$BEFORE" "$GITHUB_SHA"
          fi

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Pinned to a commit SHA (not @main): that code runs with this repo's deploy secrets.
    uses: digitaleraluhut/homelab/.github/workflows/deploy-to-cluster.yml@eb841322f3792d9efe4da5f1e1590148da0f3c4b
    with:
      pulumi-stack: ${{ matrix.stack }}
      working-directory: ${{ matrix.dir }}
      pulumi-command: up
      npm-lock-file-path: package-lock.json
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  # After the rollout of agentic-office: TLS handshake and an unauthenticated GetChallenge with a
  # bad public key must answer `unauthenticated`. The public URL is the repository variable
  # AGENTIC_OFFICE_URL (https://<domainPrefix>.<domain>), kept out of the repository.
  smoke-agentic-office:
    name: Smoke agentic-office
    needs: [plan, deploy]
    if: needs.plan.outputs.any == 'true' && contains(needs.plan.outputs.matrix, 'agentic-office') && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TLS handshake and unauthenticated GetChallenge
        env:
          URL: ${{ vars.AGENTIC_OFFICE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::repository variable AGENTIC_OFFICE_URL is not set; the smoke check did not run"
            exit 1
          fi
          python3 .github/scripts/smoke_agentic_office.py "$URL" --wait 300
