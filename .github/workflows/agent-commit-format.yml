name: Agent commit format

# Commits by the operator's GitHub App (digitaleraluhut-operator[bot]; other bots
# such as github-actions[bot] image bumps are not checked)
# must contain the mandatory sections of the commit skill: "## Intent" and
# "## Key changes". Other sections and trailers are optional.
# Human commits are not checked. Required status check (context "agent-commit-format") in the
# protect-main ruleset.
# Copy to .github/workflows/agent-commit-format.yml in homelab, homelab-apps,
# local-ai and homelab-wiki.

on:
  pull_request:

permissions:
  contents: read

jobs:
  agent-commit-format:
    # Unique job name: it is the required status check context in the rulesets.
    name: agent-commit-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check agent commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$c")
            case "$email" in *"+digitaleraluhut-operator[bot]@users.noreply.github.com") ;; *) continue ;; esac
            msg=$(git log -1 --format=%B "$c")
            for h in "## Intent" "## Key changes"; do
              if ! grep -qF -- "$h" <<<"$msg"; then
                echo "::error title=Agent commit format::$(git log -1 --format='%h %s' "$c") lacks '$h' (commit skill)"
                fail=1
              fi
            done
          done
          exit $fail
